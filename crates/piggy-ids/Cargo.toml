[package]
name = "piggy-ids"
version = "0.1.0"
edition = "2021"
description = "Reader/writer for `.piggy-ids` text recipient files + piggy-ids CLI helper"
# The library half stays slim (only piggy-markl + thiserror) so
# consumers that only need to read or manipulate recipient files don't
# pay for the encrypt path. The `piggy-ids` binary that piggy.sh
# shells out to in phase 5 (#75) pulls in piggy-box for the encrypt
# subcommand; that dependency is bin-only by virtue of the
# `[[bin]]` target. See piggy#72 for the phase tracker and
# piggy#69 for the v2.0 cutover umbrella.

[[bin]]
name = "piggy-ids"
path = "src/main.rs"

[dependencies]
piggy-markl = { path = "../piggy-markl" }
piggy-box = { path = "../piggy-box" }
piggy-piv = { path = "../piggy-piv" }
clap = { version = "4", features = ["derive"] }
openssl = "0.10"
thiserror = "2"

[dev-dependencies]
proptest = "1"
