[package]
name = "card-frontend-server"
version = "0.1.0"
edition = "2021"

# Test-only helper: a scripted JSON-RPC frontend server for the `piggy card
# init` JSON-RPC conformance lane (piggy#194, RFC 0006 §4). Mirrors the
# fib-wait-ready precedent — a small Rust test binary built via
# `cargo build -p card-frontend-server` by the conformance recipe, not shipped.
[[bin]]
name = "card-frontend-server"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
