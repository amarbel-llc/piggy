[package]
name = "piggy-box"
version = "0.1.0"
edition = "2021"

[dependencies]
piggy-piv = { path = "../piggy-piv" }
piggy-markl = { path = "../piggy-markl" }
openssl = "0.10"
hex = "0.4"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
sharks = "0.5"

[dev-dependencies]
openssl = "0.10"
# Only the ec_point_to_ssh_pubkey_blob unit tests need ssh-key, for
# the interop assertion that our hand-rolled sshkey wire blob matches
# what `ssh_key::PublicKey::to_bytes` produces. Keeping it in
# `[dev-dependencies]` ensures piggy-box's production binary stays
# ssh-key-free — the agent-oracle consumer in the `piggy` crate is
# where the runtime dep lives.
ssh-key = { version = "0.6", features = ["alloc", "ecdsa"] }
# Independent ChaCha20-Poly1305 implementation used as a second-impl
# oracle for piv_box's openssl-based AEAD path. Test-only; piggy-box
# itself never compiles against this crate. See #38 for context.
chacha20poly1305 = "0.10"
# Property-based fuzzer for the piv_box / ebox / stream / template
# wire parsers. Test-only. See #40.
proptest = "1"
# Project Wycheproof test vectors for cross-checking primitives
# (ECDH P-256/P-384, ChaCha20-Poly1305, AES-256-GCM, HMAC-SHA-256)
# against adversarial / malformed inputs. Test-only; piggy-box's
# production binary never compiles against it.
wycheproof = "0.6"
