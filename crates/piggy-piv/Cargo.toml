[package]
name = "piggy-piv"
version = "0.1.0"
edition = "2021"

[features]
# Default on: every piggy-side consumer keeps the PC/SC transport.
# `default-features = false` drops the native pcsclite link so pigsty can
# drive PIV over its own ApduTransport on Android and wasm (piggy#337).
#
# Named `pcsc-transport`, not `pcsc`: cargo-auditable (the nix build) runs
# `cargo metadata --features <this crate's features>` across the workspace,
# and fibby's optional `pcsc` dependency makes a `pcsc` feature name an error
# there.
default = ["pcsc-transport", "openssl-api"]
pcsc-transport = ["dep:pcsc"]
# The two OpenSSL-shaped APIs piggy itself uses: `display_fields` (DNs in
# OpenSSL's X509_NAME_oneline form, byte-for-byte with C for `tool list`)
# and `raw_ed25519_from_spki` (takes an OpenSSL key). Named so as not to
# collide with any member's `openssl` dependency (see above).
openssl-api = ["dep:openssl"]

[dependencies]
pcsc = { version = "2.9", optional = true }
hex = "0.4"
openssl = { version = "0.10", optional = true }
ssh-key = { version = "0.6", features = ["alloc", "ecdsa", "rsa", "ed25519"] }
thiserror = "2"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }
# X.509 building for self-signed slot certs at provisioning time (piggy#194).
# der/spki/const-oid are already in the lock (transitive via ssh-key); x509-cert
# 0.2 pins those same majors. We assemble the cert manually (build TBS -> card
# sign -> assemble) rather than via the `builder` Signer trait, so no extra
# features are needed.
x509-cert = "0.2"
der = "0.7"
const-oid = "0.9"
spki = "0.7"
# Reading a slot cert's public key without OpenSSL (piggy#337): normalize an
# EC point to SEC1 uncompressed, and parse an RSA SPKI. All already in the lock.
p256 = "0.13"
p384 = "0.13"
elliptic-curve = { version = "0.13", features = ["sec1"] }
pkcs1 = "0.7"
# Provisioning without OpenSSL (piggy#337): the TBS/CSR digest and the
# 3DES management-key witness. Both already in the lock (fibby uses des).
sha2 = "0.10"
des = "0.8"

[dev-dependencies]
# fibby's VirtualCard as an in-process ApduTransport (pigsty design §5):
# the PIV session logic runs against the virtual card without pcscd.
fibby = { path = "../fibby" }
# The independent oracle the pure-Rust cert/3DES/digest paths are tested
# against (piggy#337).
openssl = "0.10"
# card_ecdh_tests checks the card's ECDH against a software ECDH (piggy#341).
p256 = { version = "0.13", features = ["ecdh"] }
