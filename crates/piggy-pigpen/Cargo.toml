[package]
name = "piggy-pigpen"
version = "0.1.0"
edition = "2021"
description = "Prototype of the pigpen encrypted-document format (piggy RFC 0008) — pure-Rust, wasm-buildable"

# This crate is intentionally NOT a member of the piggy workspace (see the
# root Cargo.toml `exclude`). It uses the pure-Rust RustCrypto stack so a
# wasm32-unknown-unknown build is possible, and does not depend on the
# OpenSSL-backed piggy-box.

# An empty [workspace] table makes this crate its own workspace root, so cargo
# stops walking up the directory tree here. Without it, a build from a nested
# git worktree (.worktrees/<name>/crates/piggy-pigpen) walks past the worktree's
# own Cargo.toml to the ROOT repo's Cargo.toml, whose `exclude` path
# ("crates/piggy-pigpen") does not match the worktree path — so cargo errors
# with "current package believes it's in a workspace when it's not".

[workspace]

[features]
default = []
# `wasm` is a RESERVED placeholder for the future wasm-bindgen JS-adapter gate
# described in docs/plans/2026-06-24-pigpen-wasm.md. It currently gates NO code
# (nothing reads `#[cfg(feature = "wasm")]`) — wasm32 builds already work
# without it, because the getrandom "js" backend is pulled in unconditionally
# by the `cfg(target_arch = "wasm32")` dependency below, not by this feature.
# Passing `--features wasm` today is a harmless no-op; the plan's build recipes
# keep it so the flag is stable once the adapter lands. Tracked in #210.
wasm = []

[dependencies]
piggy-markl = { path = "../piggy-markl" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"
zeroize = "1"

# On wasm32, getrandom needs its "js" backend so OsRng works in the
# browser/Node host (see docs/plans/2026-06-24-pigpen-wasm.md).

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"
