[package]
name = "piggy-pigpen"
version = "0.1.0"
edition = "2021"
description = "Prototype of the pigpen encrypted-document format (piggy RFC 0008) — pure-Rust, wasm-buildable"

# This crate is intentionally NOT a member of the piggy workspace (see the
# root Cargo.toml `exclude`). It uses the pure-Rust RustCrypto stack so a
# wasm32-unknown-unknown build is possible, and does not depend on the
# OpenSSL-backed piggy-box.

[features]
default = []
# `wasm` drops the OsRng/getrandom-native assumption; a wasm host must
# enable getrandom's "js" backend (see docs/plans/2026-06-24-pigpen-wasm.md).
wasm = []

[dependencies]
piggy-markl = { path = "../piggy-markl" }
x25519-dalek = { version = "2", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdh"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
thiserror = "2"

# On wasm32, getrandom needs its "js" backend so OsRng works in the
# browser/Node host (see docs/plans/2026-06-24-pigpen-wasm.md).
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
hex = "0.4"
