[package]
name = "pigtrough"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "The auth decoration proxy pilot (FDR 0009): clients send plain HTTP over a unix socket, piggy attaches the credential"
# The HTTP and TLS stack (FDR 0009 ruling t1: rustls with the ring provider,
# hyper on tokio) is used by the `server` (client-facing) and `tls`
# (upstream) modules only, and only in this crate: `piggy`, the agent and
# fibby must not link it (`just lint-pigtrough-stack-isolated`). Features
# are kept to what the pilot needs: HTTP/1.1 only, no default rustls
# provider (aws-lc-rs) and no logging, TLS 1.2 and 1.3.

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
libc = "0.2"
piggy-guard = { path = "../piggy-guard" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
zeroize = "1"
