[package]
name = "piggy"
# Internal Cargo metadata only; the user-visible piggy version lives in
# version.env at the repo root, read by build.rs and exposed to the
# dispatcher binary via env!("PIGGY_VERSION"). Bump via
# `just bump-version` rather than editing this line. See
# eng-versioning(7) and piggy CLAUDE.md.
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "piggy"
path = "src/main.rs"

[dependencies]
piggy-piv = { path = "../piggy-piv" }
piggy-box = { path = "../piggy-box" }
# Direct dep so `tree_recipients` can name `Id` / `FormatId` / `PurposeId`
# to render each ebox's recipient_pubkey as a `piggy-recipient-v1@…` markl
# ID (the `pass ls --recipients` annotation). Transitive via piggy-box
# already, but not re-exported, so the explicit entry makes the use legal.
piggy-markl = { path = "../piggy-markl" }
# Direct dep so `reencrypt::reencrypt_unnecessary` can parse a `piggy-ids`
# file (`RecipientFile`) and compare its recipient set against an ebox's
# parts for the TAP `# SKIP` decision. Transitive via piggy-box already;
# the explicit entry makes the `piggy_ids::RecipientFile` use-site legal.
piggy-ids = { path = "../piggy-ids" }
# Direct dep so `show_batch::classify_piv_error` can match against
# `pcsc::Error::NoSmartcard | ReaderUnavailable | RemovedCard` for the
# RFC 0005 `card-absent` mapping. Transitive via `piggy-piv` already;
# the explicit entry just makes the use-site `match` legal.
pcsc = "2.9"
openssl = "0.10"
ssh-agent-lib = "0.5"
ssh-key = { version = "0.6", features = ["alloc", "ecdsa", "rsa", "ed25519"] }
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "signal", "sync", "net", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
sha2 = "0.10"
libc = "0.2"
# Used by `show_batch` to serialize the RFC 0005 NDJSON event stream
# (plan / decrypt / summary / bail-out records). serde_json is already
# in piggy's transitive closure via piggy-box → piggy-markl, so this
# adds no new compile cost — just makes the dep explicit at the point
# of use.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TAP-14 text + tap-ndjson(7) writers for `piggy health`. Git dep on the
# spec repo's Rust crate; see docs/plans/2026-06-07-piggy-health-design.md.
tap-dancer = { git = "https://github.com/amarbel-llc/tap", tag = "v0.1.12" }
# Base64 for the `piggy papi` §10 signature `sig` field (and §9 proof
# tokens). Already in the lock closure (transitive via ssh-agent-lib); the
# explicit entry makes the encode/decode use-site legal. See piggy#182.
base64 = "0.22"

[dev-dependencies]
# tokio's test-util feature enables `tokio::time::pause` / `advance` and
# `#[tokio::test(start_paused = true)]`, which `cmd::agent::card` unit
# tests use to drive the probe-loop interval deterministically.
tokio = { version = "1", features = ["test-util"] }
# Used by tests/agent_ecdh_integration.rs to generate an ephemeral P-256
# partner key and compute the "expected" ECDH scalar locally, so the test
# can compare it against what the agent produces. See issue #32 checkpoint
# 2. Already pulled transitively via ssh-key; added explicitly so the test
# file can `use p256::...`.
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
rand = "0.8"
# Used by reencrypt.rs SKIP-helper unit tests to construct markl IDs
# (`piggy_markl::Id::new`) for the ebox + piggy-ids recipient fixtures.
# Transitive via piggy-box already; explicit for the test use-site.
piggy-markl = { path = "../piggy-markl" }
