[package]
name = "fibby"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust virtual PIV smart card that speaks the pcsc-lite client protocol directly (no pcscd / vsmartcard)."

[[bin]]
name = "fibby"
path = "src/main.rs"

[features]
# The hardware-proxy backend forwards client calls to a real pcscd via
# libpcsclite (the `pcsc` crate). Gated so the protocol core + virtual
# backend build and unit-test on hosts without PCSC headers (e.g. CI
# containers, darwin). Enable on a machine with a real reader to capture
# /validate against hardware: `cargo run -p fibby --features hardware-proxy`.
default = []
hardware-proxy = ["dep:pcsc"]

[dependencies]
pcsc = { version = "2.9", optional = true }
# VirtualCard's PIV GENERAL AUTHENTICATE uses `p256` two ways:
#   - ECDH on slot 9D (alg=0x11, P2=0x9D): `card_priv * client_eph_pub`
#     returning the X-coord (feature `ecdh`). Output is exactly the byte
#     form real silicon emits inside the `7C 22 82 20 <X>` response; see
#     piggy#134 for the byte-deterministic replay rationale.
#   - ECDSA sign on slot 9A (alg=0x11, P2=0x9A): RFC 6979 deterministic
#     signing of the client-supplied prehash (feature `ecdsa`, which pulls
#     in `signature::hazmat::PrehashSigner` + DER sig encoding). Real
#     YubiKeys sign with a random `k` and so aren't byte-replayable;
#     RFC 6979 makes VirtualCard's output reproducible (piggy#135).
# Pure arithmetic, no I/O. The lockfile already pins ecdsa/rfc6979/der
# transitively (via piggy-box, p384, ssh-key), so `ecdsa` adds no new
# external crates.
p256 = { version = "0.13", default-features = false, features = [
  "ecdh",
  "ecdsa",
] }
# `ecdsa`'s `der` feature gates `Signature::{to_der,from_der}`, which
# p256's `ecdsa` feature alone does not turn on. We need `to_der` to emit
# the ASN.1 `ECDSA-Sig-Value` real PIV cards return under the GA `82`
# tag (and `from_der` to verify it in tests). The crate is already in the
# dependency graph (transitive via piggy-box/p384/ssh-key); this just
# unifies the `der` feature onto `p256::ecdsa::Signature`.
ecdsa = { version = "0.16", default-features = false, features = ["der"] }
# 3DES (EDE3-ECB) for PIV mgmt-key challenge-response auth (INS 0x87
# P1=0x03 P2=0x9B). YubiKey's factory mgmt-key is a 24-byte triple-DES
# key used to gate admin ops (PUT DATA, GENERATE, import-cert).
# RustCrypto's `des` crate provides the `TdesEde3` cipher we drive via
# the `cipher` traits; no I/O. Used only by VirtualCard's mgmt-key
# dispatch; not part of the production decrypt path.
des = "0.8"
cipher = "0.4"
# CSPRNG for GENERATE ASYMMETRIC (INS 0x47) on-card keygen: random P-256
# keys when no deterministic override is set. `OsRng` lives behind
# rand_core's `getrandom` feature; both rand_core 0.6 and getrandom 0.2 are
# already in the lockfile (p256/elliptic-curve pull rand_core), so enabling
# the feature adds no new crate fetch. Deterministic generation (tests /
# `--generate-slot-*-priv`) bypasses the RNG entirely.
rand_core = { version = "0.6", default-features = false, features = [
  "getrandom",
] }
