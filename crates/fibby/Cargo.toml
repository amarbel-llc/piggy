[package]
name = "fibby"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust virtual PIV smart card that speaks the pcsc-lite client protocol directly (no pcscd / vsmartcard)."

[[bin]]
name = "fibby"
path = "src/main.rs"

[features]
# The hardware-proxy backend forwards client calls to a real pcscd via
# libpcsclite (the `pcsc` crate). Gated so the protocol core + virtual
# backend build and unit-test on hosts without PCSC headers (e.g. CI
# containers, darwin). Enable on a machine with a real reader to capture
# /validate against hardware: `cargo run -p fibby --features hardware-proxy`.
default = []
hardware-proxy = ["dep:pcsc"]

[dependencies]
pcsc = { version = "2.9", optional = true }
# VirtualCard's PIV GENERAL AUTHENTICATE (alg=0x11 P-256 ECDH on slot
# 9D) does `card_priv * client_eph_pub` and returns the X-coord. Pure
# arithmetic, no I/O. RustCrypto's `p256` is the de-facto P-256 crate
# for no-OpenSSL Rust; the `ecdh` feature pulls in
# `p256::ecdh::diffie_hellman` whose output is exactly the byte form
# real silicon emits inside the `7C 22 82 20 <X>` response. See
# piggy#134 for the byte-deterministic replay rationale.
p256 = { version = "0.13", default-features = false, features = ["ecdh"] }
