name: Publish every Git push to default branch to FlakeHub

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ./

jobs:
  flakehub-publish:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: "ubuntu-latest"
    permissions:
      id-token: "write"
      contents: "read"
    steps:
      - uses: "actions/checkout@v4"
      - uses: "DeterminateSystems/nix-installer-action@main"
        with:
          determinate: true
      - uses: "DeterminateSystems/flakehub-push@main"
        with:
          name: "${{ github.repository }}"
          rolling: true
          visibility: "public"
          include-output-paths: true
          directory: ./

  build-nix-package:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      # Don't abort sibling jobs when one platform fails — a darwin
      # regression should not mask a linux failure (and vice versa).
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            system: x86_64-linux
          - os: macos-15
            system: aarch64-darwin
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
        with:
          determinate: true
      - uses: DeterminateSystems/flakehub-cache-action@main
      - run: nix build
      # End-to-end suite: cargo build + bats (existing piggy bash tests
      # routed through the rust dispatcher) + cargo test. The bats step
      # is the one that proves the rust to bash dispatch path works at
      # runtime; nix build alone would not catch a regression there.
      - name: Run rust + bats end-to-end suite
        run: nix develop --command just test
