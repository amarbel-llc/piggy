[workspace]
resolver = "2"
members = [
    "crates/age-plugin-piggy",
    "crates/fib-wait-ready",
    "crates/fibby",
    "crates/piggy",
    "crates/piggy-box",
    "crates/piggy-ids",
    "crates/piggy-markl",
    "crates/piggy-piv",
]
# vendor/ holds the imported pivy source tree (see vendor/pivy/README.adoc
# and piggy #21). It has its own rust/Cargo.toml workspace that must not
# merge with piggy's — excluding keeps cargo from walking into it.
exclude = ["vendor"]
