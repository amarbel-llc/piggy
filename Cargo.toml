[workspace]
resolver = "2"
members = [
    "crates/age-plugin-piggy",
    "crates/card-frontend-server",
    "crates/fib-wait-ready",
    "crates/fibby",
    "crates/manage-client",
    "crates/piggy",
    "crates/piggy-box",
    "crates/piggy-ids",
    "crates/piggy-markl",
    "crates/piggy-piv",
]
# vendor/ holds the imported pivy source tree (see vendor/pivy/README.adoc
# and piggy #21). It has its own rust/Cargo.toml workspace that must not
# merge with piggy's — excluding keeps cargo from walking into it.
#
# crates/piggy-pigpen is the RFC 0008 prototype. It is excluded from the
# workspace on purpose: it depends on the pure-Rust RustCrypto stack (so a
# wasm32 build is possible) rather than the OpenSSL-backed piggy-box, and
# carries its own Cargo.lock that is not part of the nix `sharedCargoLock`.
# Promoting it into `members` is a cutover step (RFC 0008 "Compatibility").
exclude = ["vendor", "crates/piggy-pigpen"]
